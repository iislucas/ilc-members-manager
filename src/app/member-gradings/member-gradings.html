@let u = user();
@if (u) {
  @if (isInstructor()) {
    <div class="header-extension-tabs">
      <div class="pill-tabs">
        <button
          class="pill-tab"
          data-label="My Gradings"
          [class.active]="activeTab() === 'mine'"
          (click)="setActiveTab('mine')"
        >
          My Gradings
        </button>
        <button
          class="pill-tab"
          data-label="My Students' Gradings"
          [class.active]="activeTab() === 'students'"
          (click)="setActiveTab('students')"
        >
          My Students' Gradings
        </button>
        <button
          class="pill-tab"
          data-label="Examined/Managed"
          [class.active]="activeTab() === 'examined'"
          (click)="setActiveTab('examined')"
        >
          Examined/Managed
        </button>
      </div>
    </div>
  }

  @if (isInstructor() && activeTab() !== "mine") {
    <div class="grading-list-wrapper">
      <app-grading-list
        [gradingSet]="dataService.myGradingsAssessed"
        [viewMode]="'instructor'"
        [instructorTab]="activeTab()"
      ></app-grading-list>
    </div>
  } @else if (dataService.myGradings.error(); as error) {
    <div class="error-container">
      <span class="error-message">Could not load your gradings: {{ error }}</span>
    </div>
  } @else if (dataService.myGradings.loading()) {
    <app-spinner>Loading your gradings...</app-spinner>
  } @else {
    <app-grading-levels [member]="u.member" [gradings]="dataService.myGradings.entries()" />
  }
}
