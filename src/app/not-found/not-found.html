<div class="not-found-container">
  <div class="not-found-card">
    <div class="error-badge">
      <app-icon name="error" />
      <span class="code">404</span>
    </div>

    <h1>Page Not Found</h1>

    <p class="description">
      The page you are looking for doesn't exist, has been moved, or the link may be mistyped.
    </p>

    @if (currentPath(); as path) {
      <div class="attempted-path" title="Requested path">
        <code>{{ path }}</code>
      </div>
    }

    <div class="action-buttons">
      <button type="button" class="button primary-action" (click)="goHome()">
        <app-icon name="home" />
        {{ isLoggedIn() ? 'Return to Home' : 'Go to Home / Login' }}
      </button>

      <button type="button" class="outlined-button" (click)="goFindInstructor()">
        <app-icon name="person" />
        Find an Instructor
      </button>

      <button type="button" class="outlined-button" (click)="goEvents()">
        <app-icon name="event" />
        Events &amp; Workshops
      </button>

      <button type="button" class="outlined-button" (click)="goBack()">
        <app-icon name="arrow_back" />
        Go Back
      </button>
    </div>
  </div>
</div>
