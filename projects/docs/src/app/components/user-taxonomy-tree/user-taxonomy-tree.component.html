<div class="tree-wrapper content-card">
  <div class="tree-header">
    <div class="tree-title-area">
      <span class="tag-badge">Visual Taxonomy</span>
      <h3>Ecosystem User Actors & Personas</h3>
      <p class="subtitle">Click any persona node in the D3 tree to explore its journey starting points, multi-actor plans, and user stories.</p>
    </div>

    <div class="tree-actions">
      <button type="button" class="action-btn" (click)="resetZoom()" title="Reset to standard view">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
          <path d="M3 3v5h5"></path>
        </svg>
        Reset Zoom
      </button>
      <button type="button" class="action-btn" (click)="fitView()" title="Fit all nodes to view">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 3h6v6"></path>
          <path d="M9 21H3v-6"></path>
          <path d="M21 3l-7 7"></path>
          <path d="M3 21l7-7"></path>
        </svg>
        Fit View
      </button>
    </div>
  </div>

  <div class="svg-viewport-container">
    <svg #treeSvg class="tree-svg"></svg>
    <div class="tree-hint">💡 Scroll to zoom • Drag to pan • Click any node to inspect</div>
  </div>
</div>
